name: Build & Release Factory Images [Pre-Release]

on:
  release:
    types: [prereleased]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: main/http_server/axe-os/package-lock.json
      - name: Build web dist
        working-directory: ./main/http_server/axe-os
        run: |
          npm ci
          npm run build
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py build
          path: '.'
      - name: Upload firmware build
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp-miner.bin
            build/ota_data_initial.bin
          retention-days: 1

  factory:
    name: "Factory ${{ matrix.build_type }}"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: ["102", "201", "202", "203", "204", "205", "207", "302", "303", "400", "401", "402", "403", "601", "602", "603", "650", "701", "702", "801", "1201", "1300"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Download firmware build
        uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: .

      - name: Install esptool
        run: python3 -m pip install "esptool>=5,<6" esp-idf-nvs-partition-gen

      - name: Generate config.bin and merge factory image
        run: |
          python3 -m esp_idf_nvs_partition_gen generate configs/config-${{ matrix.build_type }}.csv config.bin 0x6000
          # NOTE: actions/upload-artifact strips the common parent dir (build/),
          # so the downloaded firmware files sit at the workspace root.
          python3 -m esptool --chip esp32s3 merge-bin \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x9000 config.bin \
            0x10000 esp-miner.bin \
            0xf10000 ota_data_initial.bin \
            -o esp-miner-factory-${{ matrix.build_type }}-${{ github.ref_name }}.bin

      - name: Release esp-miner.bin
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: "esp-miner-factory-${{ matrix.build_type }}-${{ github.ref_name }}.bin"
