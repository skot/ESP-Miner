name: Build Firmware
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.14.0'
    - name: Build web dist
      working-directory: ./main/http_server/axe-os
      run: |
        npm ci
        npm run build
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.0.2
        target: esp32s3
        command: >-
          GITHUB_ACTIONS="true" idf.py build &&
          python tools/check_bonanza_build.py &&
          python "$IDF_PATH/components/nvs_flash/nvs_partition_generator/nvs_partition_gen.py"
          generate configs/config-1004.csv config.bin 0x6000
        path: '.'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install esptool
    - name: "Create factory/merged image"
      run: |
        ./merge_bin.sh ./esp-miner-merged.bin
        ./merge_bin.sh -c ./esp-miner-factory-1004.bin
    - name: upload esp-miner-merged.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-factory.bin
        path: ./esp-miner-merged.bin
    - name: upload esp-miner-factory-1004.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-factory-1004.bin
        path: ./esp-miner-factory-1004.bin
    - name: upload esp-miner.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner.bin
        path: ./build/esp-miner.bin

