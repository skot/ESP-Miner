name: Build & Release Firmware [Release]

on:
  release:
    types: [released]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.14.0'
    - name: Build web dist
      working-directory: ./main/http_server/axe-os
      run: |
        npm ci
        npm run build
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.0.2
        target: esp32s3
        command: GITHUB_ACTIONS="true" idf.py build
        path: '.'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install esptool
    - name: "Create factory/merged image"
      run: "./merge_bin.sh ./esp-miner-merged.bin"
    - name: upload esp-miner-merged.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-factory.bin
        path: ./esp-miner-merged.bin
    - name: upload esp-miner.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner.bin
        path: ./build/esp-miner.bin

    - name: Generate SHA-256 checksum
      working-directory: ./build
      run: |
        sha256sum esp-miner.bin > esp-miner.bin.sha256
        cat esp-miner.bin.sha256
        {
          echo "### esp-miner.bin SHA-256"
          echo '```'
          cat esp-miner.bin.sha256
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Release esp-miner.bin
      uses: softprops/action-gh-release@v2.4.2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./build/esp-miner.bin
          ./build/esp-miner.bin.sha256
