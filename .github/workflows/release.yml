name: Build & Release Firmware [Release]

on:
  release:
    types: [released]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.14.0'
        cache: 'npm'
        cache-dependency-path: main/http_server/axe-os/package-lock.json
    - name: Build web dist
      working-directory: ./main/http_server/axe-os
      run: |
        npm ci
        npm run build
    - name: esp-idf build + merge
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.0.2
        target: esp32s3
        command: idf.py build && idf.py merge_bin_target
        path: '.'
    - name: upload esp-miner-merged.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-merged.bin
        path: ./esp-miner-merged.bin
        retention-days: 7
    - name: upload esp-miner.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner.bin
        path: ./build/esp-miner.bin
        retention-days: 7

    - name: Generate SHA-256 checksum
      working-directory: ./build
      run: |
        sha256sum esp-miner.bin > esp-miner.bin.sha256
        cat esp-miner.bin.sha256
        {
          echo "### esp-miner.bin SHA-256"
          echo '```'
          cat esp-miner.bin.sha256
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Release esp-miner.bin
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./build/esp-miner.bin
          ./build/esp-miner.bin.sha256
