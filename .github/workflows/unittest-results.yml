name: Publish Test Results

on:
  workflow_run:
    workflows: ["Unit Test"]
    types:
      - completed
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions: {}

jobs:
  test-results:
    name: Unit Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'

    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
      actions: read

    steps:
      - name: Download and Extract Artifacts
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
           mkdir -p artifacts && cd artifacts

           artifacts_url=${{ github.event.workflow_run.artifacts_url }}

           gh api "$artifacts_url" -q '.artifacts[] | [.name, .archive_download_url] | @tsv' | while read artifact
           do
             IFS=$'\t' read name url <<< "$artifact"
             gh api $url > "$name.zip"
             unzip -d "$name" "$name.zip"
           done

      - name: Check report inputs
        id: report-inputs
        shell: bash
        run: |
          if [[ ! -f artifacts/event-file/event.json ]]; then
            echo "::notice::No event artifact was produced; test result publishing is skipped."
            echo "No event artifact is available. See the triggering Unit Test run for its outcome; this does not indicate passing tests." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$(find artifacts -type f -name '*.xml' -print -quit)" ]]; then
            echo "::notice::No test reports were produced; test result publishing is skipped."
            echo "No test reports are available. See the triggering Unit Test run for its outcome; this does not indicate passing tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Test Results
        if: steps.report-inputs.outputs.ready == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"
