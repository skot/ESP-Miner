openapi: 3.1.0
info:
  title: ESP-Miner API
  description: API specification for ESP-Miner HTTP server
  version: 1.0.0
  license:
    name: GNU General Public License version 3
    url: https://opensource.org/license/gpl-3-0

servers:
  - url: http://{device_ip}
    description: ESP-Miner device
    variables:
      device_ip:
        default: "192.168.1.1"
        description: IP address of the ESP-Miner device

components:
  schemas:
    GenericResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    UpdateSettingsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        redirect:
          type: object
          properties:
            url:
              type: string
            delay:
              type: number
            message:
              type: string
    Pool:
      type: object
      required:
        - stratumURL
        - stratumPort
        - stratumUser
      properties:
        stratumProtocol:
          type: string
          enum: [SV1, SV2]
          description: Stratum protocol
        stratumURL:
          type: string
          description: Stratum server URL
        stratumPort:
          type: integer
          description: Stratum server port
          minimum: 1
          maximum: 65535
        stratumUser:
          type: string
          description: Stratum username
        stratumPassword:
          type: string
          description: Stratum password
          writeOnly: true
        stratumSuggestedDifficulty:
          type: number
          description: Suggested difficulty
        stratumExtranonceSubscribe:
          type: boolean
          description: Enable extranonce subscribe
        stratumTLS:
          type: integer
          description: Enable stratum TLS (0=disabled, 1=enabled, 2=enabled with verification)
          minimum: 0
          maximum: 2
        stratumCert:
          type: string
          description: Stratum TLS cert
        stratumDecodeCoinbase:
          type: boolean
          description: Enable pool coinbase transaction decoding
        stratumShareWarning:
          type: boolean
          description: Warn on the dashboard when the payout share of the coinbase reward is low. Disable for pools that pay miners directly through many coinbase outputs.
        stratumV2ChannelType:
          type: string
          enum: [standard, extended]
          description: SV2 channel type
        stratumV2AuthorityPubkey:
          type: string
          description: SV2 authority public key for certificate verification (base58-encoded)
          pattern: "^[123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]*$"
        stratumV2RequireAuth:
          type: boolean
          description: Refuse to connect unless the SV2 server certificate is verified against the authority pubkey
        id:
          type: integer
          description: Pool NVS slot index (0 to 7)
          minimum: 0
          maximum: 7
    SharesRejectedReason:
      type: object
      required:
        - message
        - count
      properties:
        message:
          type: string
          description: Rejection reason from pool
          examples:
            - "Job not found"
        count:
          type: integer
          description: Shares rejected for this reason
    WifiNetwork:
      type: object
      required:
        - ssid
        - rssi
        - authmode
      properties:
        ssid:
          type: string
          description: Network SSID
          examples:
            - "MyWiFiNetwork"
        rssi:
          type: integer
          description: Signal strength in dBm
          examples:
            - -65
        authmode:
          type: integer
          minimum: 0
          maximum: 12
          enum:
            - 0  # WIFI_AUTH_OPEN
            - 1  # WIFI_AUTH_WEP
            - 2  # WIFI_AUTH_WPA_PSK
            - 3  # WIFI_AUTH_WPA2_PSK
            - 4  # WIFI_AUTH_WPA_WPA2_PSK
            - 5  # WIFI_AUTH_WPA2_ENTERPRISE
            - 6  # WIFI_AUTH_WPA3_PSK
            - 7  # WIFI_AUTH_WPA2_WPA3_PSK
            - 8  # WIFI_AUTH_WAPI_PSK
            - 9  # WIFI_AUTH_OWE
            - 10 # WIFI_AUTH_WPA3_ENT_192
            - 11 # WIFI_AUTH_WPA3_PSK_192 (deprecated)
            - 12 # WIFI_AUTH_WPA3_EXT_PSK (deprecated)
          description: |
            Authentication mode:
            * 0 - OPEN
            * 1 - WEP
            * 2 - WPA_PSK
            * 3 - WPA2_PSK
            * 4 - WPA_WPA2_PSK
            * 5 - WPA2_ENTERPRISE
            * 6 - WPA3_PSK
            * 7 - WPA2_WPA3_PSK
            * 8 - WAPI_PSK
            * 9 - OWE (Opportunistic Wireless Encryption)
            * 10 - WPA3_ENT_192 (Enterprise Suite-B)
            * 11 - WPA3_PSK_192 (deprecated, use WPA3_PSK)
            * 12 - WPA3_EXT_PSK (deprecated, use WPA3_PSK)
          examples:
            - 3
    HashrateMonitorAsic:
      type: object
      required:
        - total
        - domains
        - errorCount
      properties:
        total:
          type: number
          description: Hashrate
        domains:
          type: array
          description: Hashrate per domain
          items:
            type: number
        errorCount:
          description: Number of errors
          type: number

    SystemPartition:
      type: object
      required:
        - label
        - isCurrent
        - isFactory
      properties:
        label:
          type: string
          description: Partition label (e.g., ota_0, ota_1, factory)
        version:
          type: string
          nullable: true
          description: Firmware version on this partition
        compileDate:
          type: string
          nullable: true
          description: Compile date of the firmware on this partition
        compileTime:
          type: string
          nullable: true
          description: Compile time of the firmware on this partition
        isCurrent:
          type: boolean
          description: Whether this is the currently running partition
        isFactory:
          type: boolean
          description: Whether this is a factory partition
        usagePercent:
          type: integer
          nullable: true
          description: Partition space usage percentage (0-100)

    FirmwareChecksum:
      type: object
      required:
        - partition
        - version
        - size
        - sha256
      properties:
        partition:
          type: string
          description: Label of the running partition (e.g., ota_0, ota_1, factory)
        version:
          type: string
          description: Firmware version of the running image
        size:
          type: integer
          description: Size of the running image in bytes
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the running image, comparable to the release esp-miner.bin checksum

    SystemInfo:
      type: object
      required:
        - ASICModel
        - apEnabled
        - autofanspeed
        - bestDiff
        - bestSessionDiff
        - boardVersion
        - coreVoltage
        - coreVoltageActual
        - current
        - display
        - fallbackStratumExtranonceSubscribe
        - fallbackStratumPort
        - fallbackStratumSuggestedDifficulty
        - fallbackStratumURL
        - fallbackStratumUser
        - fallbackStratumTLS
        - fallbackStratumCert
        - fallbackStratumDecodeCoinbase
        - fallbackStratumShareWarning
        - fanrpm
        - fan2rpm
        - fanspeed
        - temptarget
        - rotation
        - cpuUsage
        - freeHeap
        - freeHeapInternal
        - freeHeapSpiram
        - minFreeHeap
        - maxAllocHeap
        - frequency
        - actualFrequency
        - hashRate
        - hashRate_1m
        - hashRate_10m
        - hashRate_1h
        - expectedHashrate
        - errorPercentage
        - hostname
        - idfVersion
        - invertscreen
        - isPSRAMAvailable
        - isUsingFallbackStratum
        - macAddr
        - manualFanSpeed
        - maxPower
        - minFanSpeed
        - nominalVoltage
        - overheat_mode
        - overclockEnabled
        - primaryPoolIndex
        - secondaryPoolIndex
        - useFallbackStratum
        - pools
        - poolConnectionInfo
        - poolDifficulty
        - power
        - resetReason
        - responseTime
        - runningPartition
        - sharesAccepted
        - sharesRejected
        - sharesRejectedReasons
        - smallCoreCount
        - ssid
        - ipv4
        - ipv6
        - stratumExtranonceSubscribe
        - stratumPort
        - stratumProtocol
        - stratumV2AuthorityPubkey
        - stratumSuggestedDifficulty
        - stratumURL
        - stratumUser
        - stratumTLS
        - stratumCert
        - stratumDecodeCoinbase
        - stratumShareWarning
        - temp
        - temp2
        - uptimeSeconds
        - useNTP
        - version
        - axeOSVersion
        - voltage
        - vrTemp
        - wifiStatus
        - wifiRSSI
        - displayTimeout
        - statsFrequency
        - blockHeight
        - scriptsig
        - networkDifficulty
        - blockSignals
        - blockFound
        - coinbaseValueTotalSatoshis
        - coinbaseValueUserSatoshis
        - coinbaseOthersCount
        - coinbaseOthersValueSatoshis
        - miningPaused
        - statsLimit
        - partitions
        - useCustomWWW
      properties:
        ASICModel:
          type: string
          description: ASIC model identifier
        apEnabled:
          type: number
          description: Whether AP mode is enabled (0=no, 1=yes)
        autofanspeed:
          type: number
          description: Automatic fan speed control (0=manual, 1=auto)
        bestDiff:
          type: number
          description: Best difficulty achieved
        bestSessionDiff:
          type: number
          description: Best difficulty achieved in current session
        boardVersion:
          type: string
          description: Hardware board version
        coreVoltage:
          type: number
          description: Configured ASIC core voltage
        coreVoltageActual:
          type: number
          description: Actual measured ASIC core voltage
        current:
          type: number
          description: Current draw in milliamps
        display:
          type: string
          description: The configured display
        fallbackStratumExtranonceSubscribe:
          type: boolean
          description: Enable fallback pool extranonce subscription
        fallbackStratumPort:
          type: number
          description: Fallback stratum server port
        fallbackStratumSuggestedDifficulty:
          type: number
          description: Fallback pool suggested difficulty
        fallbackStratumURL:
          type: string
          description: Fallback stratum server URL
        fallbackStratumUser:
          type: string
          description: Fallback stratum username
        fallbackStratumTLS:
          type: boolean
          description: Enable fallback stratum TLS
        fallbackStratumCert:
          type: string
          description: Fallback stratum TLS cert
        fallbackStratumDecodeCoinbase:
          type: boolean
          description: Enable fallback pool coinbase transaction decoding
        fallbackStratumShareWarning:
          type: boolean
          description: Warn on the dashboard when the payout share of the coinbase reward is low, while mining on the fallback pool
        fallbackStratumProtocol:
          type: string
          enum: [SV1, SV2]
          description: Configured fallback stratum protocol
        fallbackStratumV2AuthorityPubkey:
          type: string
          description: Fallback SV2 authority public key for certificate verification (base58-encoded)
        fallbackStratumV2ChannelType:
          type: string
          enum: [standard, extended]
          description: Configured fallback SV2 channel type
        fanrpm:
          type: number
          description: Current fan speed in RPM
        fan2rpm:
          type: number
          description: Current secondary fan speed in RPM
        fanspeed:
          type: number
          description: Current fan speed percentage
        temptarget:
          type: number
          description: Target Temperature for the PID Controller
        responseTime:
          type: number
          description: Pool response time in ms
        responseShareBatch:
          type: number
          description: Number of shares acknowledged in the batch that produced responseTime (SV2; 1 = single share, >1 = batched ack)
        rotation:
          type: number
          description: Screen rotation setting (0, 90, 180, 270)
        cpuUsage:
          type: number
          description: CPU usage percentage
        freeHeap:
          type: number
          description: Available heap memory in bytes
        freeHeapInternal:
          type: number
          description: Available internal heap memory in bytes
        freeHeapSpiram:
          type: number
          description: Available Spiram heap memory in bytes
        minFreeHeap:
          type: number
          description: All-time low watermark for free heap memory in bytes
        maxAllocHeap:
          type: number
          description: Largest contiguous free block of internal heap memory in bytes
        frequency:
          type: number
          description: ASIC frequency in MHz
        actualFrequency:
          type: number
          description: Real-time ASIC frequency in MHz
        hashRate:
          type: number
          description: Current hashrate in Gh/s
        hashRate_1m:
          type: number
          description: Current hashrate 1m average
        hashRate_10m:
          type: number
          description: Current hashrate 10m average
        hashRate_1h:
          type: number
          description: Current hashrate 1h average
        expectedHashrate:
          type: number
          description: Expected hashrate at current voltage/frequency settings, in Gh/s
        errorPercentage:
          type: number
          description: Hash error percentage
        hostname:
          type: string
          description: Device hostname
        fullHostname:
          type: string
          description: Full hostname including .local domain for mDNS
        mdnsHostname:
          type: string
          description: mDNS/Bonjour hostname for network discovery
        idfVersion:
          type: string
          description: ESP-IDF version
        invertscreen:
          type: number
          description: Screen invert setting (0=normal, 1=inverted)
        isPSRAMAvailable:
          type: number
          description: Whether PSRAM is available (0=no, 1=yes)
        isUsingFallbackStratum:
          type: number
          description: Whether using fallback stratum (0=no, 1=yes)
        macAddr:
          type: string
          description: Device MAC address
        manualFanSpeed:
          type: integer
          description: Fan speed when auto fan speed is disabled
        maxPower:
          type: integer
          description: Maxmium power draw of the board in watts
        minFanSpeed:
          type: integer
          description: Minimum fan speed percentage when using auto fan control
        nominalVoltage:
          type: integer
          description: Nominal board voltage
        overheat_mode:
          type: number
          description: Overheat protection mode
        overclockEnabled:
          type: integer
          description: Set custom voltage/frequency in AxeOS
        useCustomWWW:
          type: integer
          description: Whether to serve files from the SPIFFS www partition instead of the embedded Web UI (0=embedded, 1=custom/SPIFFS)
          enum: [0, 1]
        primaryPoolIndex:
          type: integer
          description: Index of the primary pool
        secondaryPoolIndex:
          type: integer
          description: Index of the secondary pool (fallback)
        pools:
          type: array
          description: Configured stratum pools
          items:
            $ref: '#/components/schemas/Pool'
        poolConnectionInfo:
          type: string
          description: Current pool address family
        poolDifficulty:
          type: number
          description: Current pool difficulty
        power:
          type: number
          description: Power consumption in watts
        power_fault:
          type: string
          description: Voltage regulator fault reason, if any
        hardware_fault:
          type: string
          description: Hardware/Peripheral fault reason, if any
        resetReason:
          type: string
          description: Reason for the last system reset
        runningPartition:
          type: string
          description: Currently active OTA partition
        sharesAccepted:
          type: number
          description: Number of accepted shares
        sharesRejected:
          type: number
          description: Number of rejected shares
        totalUptimeSeconds:
          type: number
          description: Total uptime in seconds
        totalHashes:
          type: number
          description: Total hashes done by the device
        totalLog2Work:
          type: number
          description: Log2 of total hashes
        sharesPending:
          type: number
          description: Shares submitted but not yet resolved by the pool (SV2; 0 for SV1). Rises while the pool batches/buffers acks, drops to 0 once it catches up.
        sharesRejectedReasons:
          type: array
          description: Reason(s) shares were rejected
          items:
            $ref: '#/components/schemas/SharesRejectedReason'
        smallCoreCount:
          type: number
          description: Number of small cores
        ssid:
          type: string
          description: Connected WiFi network SSID
        ipv4:
          type: string
          description: IPv4 address
        ipv6:
          type: string
          description: IPv6 address
        stratumExtranonceSubscribe:
          type: boolean
          description: Enable pool extranonce subscription
        stratumPort:
          type: number
          description: Primary stratum server port
        stratumProtocol:
          type: string
          enum: [SV1, SV2]
          description: Configured stratum protocol
        stratumV2AuthorityPubkey:
          type: string
          description: SV2 authority public key for certificate verification (base58-encoded)
        stratumV2ChannelType:
          type: string
          enum: [standard, extended]
          description: Configured SV2 channel type
        stratumSuggestedDifficulty:
          type: number
          description: Pool suggested difficulty
        stratumURL:
          type: string
          description: Primary stratum server URL
        stratumUser:
          type: string
          description: Primary stratum username
        stratumTLS:
          type: boolean
          description: Enable primary pool TLS
        stratumCert:
          type: string
          description: Primary stratum TLS cert
        stratumDecodeCoinbase:
          type: boolean
          description: Enable primary pool coinbase transaction decoding
        stratumShareWarning:
          type: boolean
          description: Warn on the dashboard when the payout share of the coinbase reward is low, while mining on the primary pool
        temp:
          type: number
          description: Average chip temperature
        temp2:
          type: number
          description: Average chip temperature from second sensor
        uptimeSeconds:
          type: number
          description: System uptime in seconds
        useFallbackStratum:
          type: integer
          description: Whether fallback stratum is selected as primary preference (0=no, 1=yes)
        version:
          type: string
          description: Firmware version
        axeOSVersion:
          type: string
          description: AxeOS version
        voltage:
          type: number
          description: Input voltage
        vrTemp:
          type: number
          description: Voltage regulator temperature
        wifiStatus:
          type: string
          description: WiFi connection status
        wifiRSSI:
          type: number
          description: WiFi signal strength
        displayTimeout:
          type: number
          description: Turn off display after timeout
        statsFrequency:
          type: number
          description: Statistics frequency in seconds
        blockHeight:
          type: integer
          description: Current block height
        scriptsig:
          type: string
          description: Scriptsig extracted from coinbase transaction
        networkDifficulty:
          type: number
          description: Current network difficulty
        blockSignals:
          type: array
          description: Active block signaling (e.g., BIP-110)
          items:
            type: string
        blockFound:
          type: number
          description: Number of blocks found
        showNewBlock:
          type: boolean
          description: Whether to show the block found notification
        coinbaseOutputs:
          type: array
          description: Coinbase transaction outputs
          items:
            type: object
            title: coinbaseOutput
            required:
              - value
              - address
            properties:
              value:
                type: integer
                description: Output value in satoshis
              address:
                type: string
                description: Output address
        coinbaseValueTotalSatoshis:
          type: integer
          description: Total value of coinbase transaction in satoshis
        coinbaseValueUserSatoshis:
          type: integer
          description: User's portion of coinbase value in satoshis
        coinbaseOthersCount:
          type: integer
          description: Number of payout outputs that did not fit in coinbaseOutputs
        coinbaseOthersValueSatoshis:
          type: integer
          description: Summed value in satoshis of the outputs counted in coinbaseOthersCount
        hashrateMonitor:
          type: object
          required:
            - asics
          properties:
            asics:
              type: array
              description: Hashrate register value per ASIC
              items:
                $ref: '#/components/schemas/HashrateMonitorAsic'
        miningPaused:
          type: boolean
          description: Whether mining is currently paused
        statsLimit:
          type: integer
          description: Maximum number of statistics data points
        workReceived:
          type: integer
          description: Total number of mining jobs received from the pool
        partitions:
          type: array
          description: List of available app partitions and their firmware versions
          items:
            $ref: '#/components/schemas/SystemPartition'
        useNTP:
          type: boolean
          description: Whether NTP time sync is enabled
    SystemASIC:
      type: object
      required:
        - ASICModel
        - swarmColor
        - asicCount
        - deviceModel
        - defaultFrequency
        - frequencyOptions
        - defaultVoltage
        - voltageOptions
      properties:
        ASICModel:
          type: string
          description: ASIC model identifier
          enum:
            - BM1366
            - BM1368
            - BM1370
            - BM1373
            - BM1397
          examples:
            - "BM1366"
        deviceModel:
          type: string
          description: Device model name
          examples:
            - "Ultra"
        swarmColor:
          type: string
          description: Swarm color
          examples:
            - "purple"
        asicCount:
          type: number
          description: Number of ASICs detected
        defaultFrequency:
          type: number
          description: Default frequency for the ASIC model in MHz
          examples:
            - 450
        frequencyOptions:
          type: array
          description: Available frequency options for the ASIC model in MHz
          items:
            type: number
          examples:
            - [400, 425, 450, 475, 485, 500, 525, 550, 575]
        defaultVoltage:
          type: number
          description: Default voltage for the ASIC model in millivolts
          examples:
            - 1100
        voltageOptions:
          type: array
          description: Available voltage options for the ASIC model in millivolts
          items:
            type: number
          examples:
            - [1100, 1150, 1200, 1250, 1300]

    SystemStatistics:
      type: object
      required:
        - currentTimestamp
        - labels
        - statistics
      properties:
        currentTimestamp:
          type: number
          description: Current timestamp as a reference
        labels:
          type: array
          description: Labels for statistics data value index
          items:
            type: string
        statistics:
          type: array
          description: Statistics data point(s)
          items:
            type: array
            description: Statistics data values(s)
            items:
              type: number

    SystemScoreboardEntry:
      type: object
      required:
        - difficulty
        - job_id
        - extranonce2
        - ntime
        - nonce
        - version_bits
      properties:
        rank:
          type: number
          description: Rank of the share in the scoreboard
        since:
          type: number
          description: Time since share found in seconds
        difficulty:
          type: number
          description: Difficulty of the share
        job_id:
          type: string
          description: Job ID of the share
        extranonce2:
          type: string
          description: Extranonce2 of the share
        ntime:
          type: number
          description: Ntime of the share
        nonce:
          type: string
          description: Nonce of the share
        version_bits:
          type: string
          description: Version bits of the share

    Settings:
      type: object
      properties:
        useFallbackStratum:
          type: number
          description: Forces the use the fallback stratum pool
        primaryPoolIndex:
          type: integer
          description: Index of the primary pool
        secondaryPoolIndex:
          type: integer
          description: Index of the secondary pool (fallback)
        pools:
          type: array
          description: Configured stratum pools
          items:
            $ref: '#/components/schemas/Pool'
        stratumURL:
          type: string
          description: Primary stratum server URL
          examples:
            - "stratum+tcp://pool.example.com"
        fallbackStratumURL:
          type: string
          description: Fallback stratum server URL used when primary is unavailable
          examples:
            - "stratum+tcp://backup.example.com"
        stratumUser:
          type: string
          description: Username for primary stratum server
          examples:
            - "worker1"
        stratumPassword:
          type: string
          description: Password for primary stratum server
          writeOnly: true
          examples:
            - "x"
        fallbackStratumUser:
          type: string
          description: Username for fallback stratum server
          examples:
            - "worker1"
        fallbackStratumPassword:
          type: string
          description: Password for fallback stratum server
          writeOnly: true
          examples:
            - "x"
        stratumPort:
          type: integer
          description: Port number for primary stratum server
          minimum: 1
          maximum: 65535
          examples:
            - 3333
        stratumProtocol:
          type: string
          description: Stratum protocol
          enum: [SV1, SV2]
          examples:
            - "SV1"
        stratumV2ChannelType:
          type: string
          description: SV2 channel type
          enum: [standard, extended]
          examples:
            - "standard"
        stratumV2AuthorityPubkey:
          type: string
          description: Optional SV2 authority public key for certificate verification (base58-encoded)
          pattern: "^[123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]*$"
          maxLength: 52
          examples:
            - ""
            - "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
        fallbackStratumPort:
          type: integer
          description: Port number for fallback stratum server
          minimum: 1
          maximum: 65535
          examples:
            - 3333
        fallbackStratumProtocol:
          type: string
          description: Fallback stratum protocol
          enum: [SV1, SV2]
          examples:
            - "SV1"
        fallbackStratumV2ChannelType:
          type: string
          description: Fallback SV2 channel type
          enum: [standard, extended]
          examples:
            - "standard"
        fallbackStratumV2AuthorityPubkey:
          type: string
          description: Optional fallback SV2 authority public key for certificate verification (base58-encoded)
          pattern: "^[123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]*$"
          maxLength: 52
          examples:
            - ""
        ssid:
          type: string
          description: WiFi network SSID
          minLength: 1
          maxLength: 32
          examples:
            - "MyWiFiNetwork"
        wifiPass:
          type: string
          description: WiFi network password
          writeOnly: true
          minLength: 8
          maxLength: 63
          examples:
            - "MySecurePassword123"
        hostname:
          type: string
          description: Device hostname
          pattern: "^[a-zA-Z0-9-]+$"
          examples:
            - "esp-miner-1"
        coreVoltage:
          type: integer
          description: ASIC core voltage in millivolts
          minimum: 1
          examples:
            - 850
        frequency:
          type: integer
          description: ASIC frequency in MHz
          minimum: 1
          examples:
            - 450
        rotation:
          type: integer
          description: Whether to rotate the screen orientation (0, 90, 180, 270 degrees)
          enum: [0, 1]
          examples:
            - 0
        overheat_mode:
          type: integer
          description: Overheat protection mode (0=disabled)
          enum: [0]
          examples:
            - 0
        overclockEnabled:
          type: integer
          description: Set custom voltage/frequency in AxeOS (0=disabled, 1=enabled)
          enum: [0,1]
          examples:
            - 0
        useCustomWWW:
          type: integer
          description: Whether to serve files from the SPIFFS www partition instead of the embedded Web UI (0=embedded, 1=custom/SPIFFS)
          enum: [0, 1]
          examples:
            - 0
        invertscreen:
          type: integer
          description: Whether to invert screen colors (0=normal, 1=inverted)
          enum: [0, 1]
          examples:
            - 0
        autofanspeed:
          type: integer
          description: Whether to enable automatic fan speed control (0=manual, 1=auto)
          enum: [0, 1]
          examples:
            - 1
        manualFanSpeed:
          type: integer
          description: Manual fan speed percentage when autofanspeed is disabled
          minimum: 0
          maximum: 100
          examples:
            - 80
        temptarget:
          type: integer
          description: Manual Temperature Target in °C when autofanspeed is enabled
          minimum: 0
          maximum: 100
          examples:
            - 66
        displayTimeout:
          type: integer
          description: Set display timeout time in minutes (-1=display on, 0=display off)
          minimum: -1
          maximum: 71582
          examples:
            - 10
        statsFrequency:
          type: integer
          description: Set statistics frequency in seconds (0=disabled)
          minimum: 0
          examples:
            - 120
      additionalProperties: true

  responses:
    UnauthorizedError:
      description: Unauthorized - Client not in allowed network range

    InternalError:
      description: Internal server error

paths:
  /api/system/wifi/scan:
    get:
      summary: Scan for available WiFi networks
      description: Returns a list of available WiFi networks in range
      operationId: scanWifiNetworks
      tags:
        - wifi
      responses:
        '200':
          description: Successful scan
          content:
            application/json:
              schema:
                title: SystemWifiScan
                type: object
                required:
                  - networks
                properties:
                  networks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WifiNetwork'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/info:
    get:
      summary: Get system information
      description: Returns current system status and information
      operationId: getSystemInfo
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/logs:
    get:
      summary: Download system logs
      description: Returns the current system logs as a text file
      operationId: downloadSystemLogs
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/asic:
    get:
      summary: Get ASIC settings information
      description: Returns current ASIC model and corresponding available frequency and voltage options
      operationId: getAsicSettings
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemASIC'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/statistics:
    get:
      summary: Get system statistics
      description: Returns system statistics
      operationId: getSystemStatistics
      parameters:
        - in: query
          name: columns
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
            example: [hashrate,hashrate_1m,hashrate_10m,hashrate_1h,asicTemp,vrTemp,asicVoltage,voltage,power,current,fanSpeed,fanRpm,fan2Rpm,wifiRssi,freeHeap,responseTime]
          description: List of labels for which data should be retrieved
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatistics'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/scoreboard:
    get:
      summary: Get best difficulty share scoreboard
      description: Returns top 20 best difficulty shares
      operationId: getSystemScoreboard
      tags:
        - system
      responses:
        '200':      
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemScoreboardEntry'

  /api/system/pause:
    post:
      summary: Pause mining
      description: Pauses mining activity
      operationId: pauseMining
      tags:
        - system
      responses:
        '200':
          description: Mining paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/resume:
    post:
      summary: Resume mining
      description: Resumes mining activity
      operationId: resumeMining
      tags:
        - system
      responses:
        '200':
          description: Mining resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/boot:
    post:
      summary: Set next boot partition
      description: Sets the partition to be used for the next system boot
      operationId: setBootPartition
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partition
              properties:
                partition:
                  type: string
                  description: Partition label to boot from (e.g., ota_0, ota_1, factory)
      responses:
        '200':
          description: Boot partition set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Invalid partition label
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/firmware/checksum:
    get:
      summary: Get running firmware checksum
      description: Returns the SHA-256 of the running firmware image, matching sha256sum of the flashed esp-miner.bin
      operationId: getFirmwareChecksum
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareChecksum'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/restart:
    post:
      summary: Restart the system
      description: Triggers a system restart
      operationId: restartSystem
      tags:
        - system
      responses:
        '200':
          description: System restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/identify:
    post:
      summary: Identify the device
      description: Let the device say Hi!
      operationId: identifySystem
      tags:
        - system
      responses:
        '200':
          description: Device identify initiated
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/blockFound/dismiss:
    post:
      summary: Dismiss block found notification
      description: Dismisses the block found notification while preserving the count
      operationId: dismissBlockFound
      tags:
        - system
      responses:
        '200':
          description: Block found notification dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  blockFound:
                    type: number
                    description: Number of blocks found
                  showNewBlock:
                    type: boolean
                    description: Whether to show the block found notification
                  message:
                    type: string
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system:
    patch:
      summary: Update system settings
      description: Updates system configuration settings
      operationId: updateSystemSettings
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettingsResponse'
        '400':
          description: Invalid settings provided
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/OTA:
    post:
      summary: Update system firmware
      description: Upload and apply new firmware via OTA update
      operationId: updateFirmware
      tags:
        - system
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Firmware update successful
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid firmware file
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/OTAWWW:
    post:
      summary: Update web interface
      description: Upload and apply new web interface files
      operationId: updateWebInterface
      tags:
        - system
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Web interface update successful
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid web interface file
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error
